name: FPL watch

on:
  schedule:
    # Every two hours. Deadlines move week to week, so the cron is dumb and
    # notify.py decides whether there is anything worth saying.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Post to Discord even if nothing changed'
        type: boolean
        default: false

# Needed to commit .fpl-state.json, which is how "has this changed?" survives
# between runs. Deliberately no `push` trigger, so that commit cannot loop.
permissions:
  contents: write

concurrency:
  group: fpl-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pulp

      - name: Check squad and notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 notify.py --state team_state.json ${{ inputs.force && '--force' || '' }}

      - name: Persist what we have already seen
        run: |
          if [ -n "$(git status --porcelain .fpl-state.json)" ]; then
            git config user.name  "fpl-bot"
            git config user.email "fpl-bot@users.noreply.github.com"
            git add .fpl-state.json
            git commit -m "chore: record squad availability state"
            git push
          else
            echo "no state change"
          fi
