name: FPL watch

on:
  schedule:
    # Every 30 minutes. GitHub drops and delays scheduled runs under load —
    # observed gaps of up to 8h on this repo — and the 3h pre-deadline window
    # is only 3h wide, so a two-hourly cron can miss it entirely. Runs are
    # cheap (public repo, unlimited minutes) and notify.py stays silent unless
    # there is something to say, so over-scheduling costs nothing.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Post to Discord even if nothing changed'
        type: boolean
        default: false

# Needed to commit .fpl-state.json, which is how "has this changed?" survives
# between runs. Deliberately no `push` trigger, so that commit cannot loop.
permissions:
  contents: write

concurrency:
  group: fpl-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Self-checks
        run: python3 test_fpl.py

      - name: Check squad and notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Passed through env rather than interpolated into the run script:
          # interpolation is injection-proof only while the input stays boolean.
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python3 notify.py --state team_state.json --force
          else
            python3 notify.py --state team_state.json
          fi

      - name: Persist what we have already seen
        run: |
          if [ -z "$(git status --porcelain .fpl-state.json)" ]; then
            echo "no state change"; exit 0
          fi
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add .fpl-state.json
          git commit -m "chore: record squad availability state"
          # Any push to this branch between checkout and now makes the push
          # non-fast-forward. Failing here would drop the state, and the next
          # run would re-announce everything it already announced.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "push attempt $i failed, retrying"; sleep 5
          done
          echo "could not persist state after 3 attempts"; exit 1
